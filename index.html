<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pong CRT Deluxe (Refacto)</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: 'Press Start 2P', monospace;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: contrast(1.4) saturate(1.3) brightness(1.1);
      transform: scale(1.02);
      border-radius: 12px;
      box-shadow: inset 0 0 80px rgba(0, 255, 180, 0.05);
      background: black;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    #crt {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 2;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.05),
        rgba(0, 0, 0, 0.05) 1px,
        transparent 1px,
        transparent 4px
      );
      animation: flicker 1s infinite;
    }

    @keyframes flicker {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.2; }
    }

    #crt-glass {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 3;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.03) 0%,
        rgba(255, 255, 255, 0.05) 30%,
        transparent 60%
      );
      mix-blend-mode: screen;
      animation: glassGlide 5s linear infinite;
      background-size: 200% 200%;
      background-position: 0 0;
      border-radius: 10px;
    }

    @keyframes glassGlide {
      0% { background-position: 0 0; }
      100% { background-position: -100% 100%; }
    }

    #startup-effect {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: black;
      z-index: 10;
      animation: crtStartup 1.2s ease-out forwards;
    }

    @keyframes crtStartup {
      0% {
        background: white;
        transform: scaleY(1);
        opacity: 1;
      }
      30% {
        background: white;
        transform: scaleY(0.05);
        opacity: 1;
      }
      60% {
        background: white;
        transform: scaleY(0.05) scaleX(0);
        opacity: 1;
      }
      100% {
        background: black;
        transform: scaleY(1) scaleX(1);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="pong"></canvas>
    <div id="crt"></div>
    <div id="crt-glass"></div>
    <div id="startup-effect"></div>
  </div>
  <audio id="bgMusic" src="giana_intro_amiga.mp3" loop></audio>

  <!-- JS externe -->
  <script src="pong.js"></script>
</body>
</html>
